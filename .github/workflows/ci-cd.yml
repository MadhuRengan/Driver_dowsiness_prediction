name: CI/CD - Driver Drowsiness Prediction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/madhurengan/driver_dowsiness_prediction

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4"
      - name: Validate Python source
        run: python -m py_compile app.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t driver-drowsiness:${{ github.sha }} .

  publish:
    name: Publish image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop driver-drowsiness || true
            docker rm driver-drowsiness || true
            docker run -d \
              --name driver-drowsiness \
              --restart unless-stopped \
              -p 8501:8501 \
              -e MODEL_S3_BUCKET=driver-drowsiness-model-madhu-2026 \
              -e MODEL_S3_KEY=drowsiness_model.h5 \
              ${{ env.IMAGE_NAME }}:latest
            sleep 10
            curl --fail http://127.0.0.1:8501/_stcore/health
            docker image prune -f
